<div class="main-content">
  <div class="section-content section-content-p30">
    <div class="container-fluid">
      <div class="row">

        @for (tempProduct of products(); track tempProduct.id) {
          <div class="col-md-3">
            <div class="product-box">
              <a [routerLink]="['/products', tempProduct.id]">
                <img [src]="tempProduct.imageUrl" class="img-responsive">
              </a>

              <a [routerLink]="['/products', tempProduct.id]">
                <h1>{{ tempProduct.name }}</h1>
              </a>

              <div class="price">{{ tempProduct.unitPrice | currency:'USD' }}</div>
              <button (click)="addToCart(tempProduct)"class="btn btn-primary btn-sm">Add to cart</button>
            </div>
          </div>
        } @empty {
          <div class="alert alert-warning col-md-12" role="alert">
            No products found.
          </div>
        }

      </div>

      <div class="footer-pagination">
        <div class="row">
          <div class="col-md-6"></div>

          <div class="col-md-6">
            <div class="row">
              <div class="col-md-9" style="padding-left: 30%">

                <ngb-pagination [page]="pageNumber()"
                                [pageSize]="pageSize()"
                                [collectionSize]="totalElements()"
                                [maxSize]="5"
                                [boundaryLinks]="true"
                                (pageChange)="pageNumber.set($event); listProducts()">
                </ngb-pagination>

              </div>

              <div class="col-md-3 mt-2" style="text-align: right;">
                <span class="mr-2">Page Size</span>

                <select #myPageSelect
                        [value]="pageSize()"
                        (change)="updatePageSize(+myPageSelect.value)">
                  <option value="5">5</option>
                  <option value="10">10</option>
                  <option value="20">20</option>
                  <option value="50">50</option>
                </select>
              </div>

            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
